<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>A case study</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--navy:#001F3F;--gold:#F5B301;--paper:#FAF7F2;--ink:#1D2025;--quiet:#5B6472;--line:#E4E0D8;--soft:#F1EEE8;--lit:#FFF1C2}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:17px/1.6 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--navy);text-decoration-color:var(--gold);text-underline-offset:3px}
code{font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:1px 5px;border-radius:4px;word-break:break-word}
pre{background:var(--navy);color:#F5F2EA;padding:16px;border-radius:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
pre code{background:none;color:inherit;padding:0;font-size:13.5px}
[lang=ur],.ur{font-family:"Noto Nastaliq Urdu",serif;line-height:2.2;word-spacing:.15em;letter-spacing:0}
[lang=ar],.ar{font-family:"Noto Sans Arabic",sans-serif;line-height:1.9}
/* lock */
#lock{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:16px}
#lock.gone{display:none}
.lockin{max-width:420px;width:100%;text-align:center}
.lockin .mark{height:56px;width:auto;margin-bottom:24px}
.lockline{font-size:22px;font-weight:700;color:var(--navy);margin:0 0 28px}
#lockform label{display:block;color:var(--quiet);font-size:15px;margin-bottom:10px}
#lockform .row{display:flex;gap:8px}
#lockform input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid #C9C4BA;border-radius:10px;background:#fff}
#lockform button{font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer}
#lockmsg{min-height:1.6em;color:#9A3412;font-size:15px}
/* page */
.top{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--quiet)}
.top .mark{height:26px;width:auto}
main{max-width:820px;margin:0 auto;padding:0 16px 80px}
.toc{display:flex;flex-wrap:wrap;gap:6px 14px;padding:18px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.toc a{text-decoration:none;color:var(--quiet)}
.toc a:hover{color:var(--navy)}
.screen{padding:44px 0 8px;border-bottom:1px solid var(--line)}
.screen h2{font-size:34px;line-height:1.2;color:var(--navy);margin:0 0 18px;font-weight:700;letter-spacing:-.01em}
.screen h2::after{content:"";display:block;width:56px;height:3px;background:var(--gold);margin-top:14px}
.screen h3{font-size:20px;color:var(--navy);margin:34px 0 10px}
#s7 h3{border-top:1px solid var(--line);padding-top:28px}
.screen p{margin:0 0 14px}
#s2 > p:last-child{font-size:26px;font-weight:700;color:var(--navy);margin-top:28px}
li{margin:0 0 8px}
.tw{overflow-x:auto;margin:10px 0 18px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{color:var(--navy);font-weight:600;background:var(--paper)}
footer{color:var(--quiet);font-size:13px;padding-top:24px}
/* bricks */
.bricks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
.brick{background:var(--navy);color:#F5F2EA;border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;gap:4px}
.brick b{font-size:20px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.brick span{font-size:14px}
.brick i{font-style:normal;font-size:12.5px;opacity:.8;margin-top:6px}
.brick.off{background:#D9D6CF;color:#4A4F57}.brick.off b{color:#4A4F57}
.path{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.path .step{border:2px solid var(--navy);border-radius:12px;padding:8px 14px;text-align:center;background:#fff}
.path .step b{display:block;color:var(--navy)}
.path .step small,.path .join small,.beside small{color:var(--quiet);font-size:12px}
.path .teacher{border-color:var(--gold)}
.path .join{display:flex;flex-direction:column;align-items:center;min-width:56px}
.path .join span{display:block;width:100%;height:3px;background:var(--gold);border-radius:2px;margin:4px 0}
.beside{font-size:15px;color:var(--quiet)}
/* players */
.player{border:1px solid var(--line);border-radius:16px;padding:16px;margin:22px -8px;background:#fff;box-shadow:0 1px 0 var(--line)}
.player.anchor{border-color:var(--gold);border-width:2px}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:6px}
.phead .code{font-weight:700;font-size:17px}
.phead .meta{color:var(--quiet);font-size:14px}
.reason{font-size:15px;margin:2px 0 10px}
.player audio{width:100%;margin:6px 0 10px}
.astatus{font-size:13px;color:var(--quiet);margin:-6px 0 8px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:14px;padding:8px 12px;border:0;background:none;color:var(--quiet);cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--navy);font-weight:600;border-bottom-color:var(--gold)}
.panel{display:none}.panel.on{display:block}
.panel .acc{display:none}
.pbody{max-height:480px;overflow:auto;padding:12px 4px 4px;font-size:15px}
.pbody .note{color:var(--quiet);font-size:13px;margin:0 0 10px}
.seg{display:grid;grid-template-columns:52px 70px 1fr;gap:8px;padding:6px 4px;border-radius:8px}
.seg .ts{font:12.5px ui-monospace,Menlo,monospace;color:var(--navy);cursor:pointer;padding-top:4px;text-decoration:underline;text-decoration-color:var(--line)}
.seg .who{font-size:12.5px;font-weight:600;color:var(--quiet);padding-top:4px}
.seg .tx{min-width:0;overflow-wrap:anywhere}
.seg.now{background:var(--lit)}
.w.now{background:var(--gold);color:var(--navy);border-radius:3px}
.w{cursor:pointer}
.md h1,.md h2,.md h3,.md h4{font-size:16px;color:var(--navy);margin:16px 0 6px}
.md h2::after{display:none}
.md table{font-size:13.5px}
.jt dl{margin:0 0 6px;padding-left:12px;border-left:2px solid var(--line)}
.jt dt{font:12.5px ui-monospace,Menlo,monospace;color:var(--navy);margin-top:6px}
.jt dd{margin:0 0 2px;overflow-wrap:anywhere}
.jt .card{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0}
.jt .null{color:var(--quiet);font-style:italic}
/* message */
.message{margin:16px 0}
.message .wait{color:var(--quiet)}
.msg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.msg .colh{background:var(--navy);color:#F5F2EA;font-size:13px;font-weight:600;padding:8px 14px;letter-spacing:.03em}
.msg .cell{padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.msg .lab{grid-column:1 / -1;background:var(--paper);font-size:12px;font-weight:600;color:var(--quiet);padding:6px 14px;border-top:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
.msg .lab.key{text-transform:none;letter-spacing:0;font:12.5px ui-monospace,Menlo,monospace}
.msg .src{background:#FFFDF8}
.msg q{quotes:none;font-weight:600}
.message details{margin-top:12px;font-size:15px}
.message summary{cursor:pointer;color:var(--navy);font-weight:600}
@media (max-width:640px){
  body{font-size:16px}
  .screen h2{font-size:27px}
  .bricks{grid-template-columns:1fr 1fr}
  .player{margin:18px 0;padding:12px}
  .tabs{display:none}
  .panel{display:block;border-top:1px solid var(--line)}
  .panel .acc{display:block;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--navy);background:none;border:0;padding:12px 2px;cursor:pointer}
  .panel .acc::after{content:"+";float:right;color:var(--quiet)}
  .panel.on .acc::after{content:"−"}
  .panel .pbody{display:none}
  .panel.on .pbody{display:block}
  .seg{grid-template-columns:46px 1fr}
  .seg .who{grid-column:2}
  .seg .tx{grid-column:1 / -1}
  .msg{grid-template-columns:1fr}
  .path .join{min-width:30px}
}

</style>
</head>

<main id="app"></main>
<script>
window.PAGE = { sealed: true, version: "1" };
/* The candidate page (29 Oct 2026). In the sealed copy every lesson file and the page content are
   AES-GCM files keyed from the page password by PBKDF2-SHA256 (the live-show seal.py format: IV || ciphertext || tag,
   salt and iterations in media/seal.json). The plain copy (DRIVE only) fetches the same files unencrypted.
   No network address outside the page's own folder is ever requested. */
(function () {
  "use strict";
  var P = window.PAGE, KEY = null, V = "?v=" + P.version;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  /* ---------- sealed files ---------- */
  function keyFor(pw, m) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(m.salt), iterations: m.iter, hash: "SHA-256" }, base,
        { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    });
  }
  function dec(u) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, KEY, u.slice(12)); }
  function getBuf(path) {
    if (!P.sealed) return fetch(path + V).then(function (r) { if (!r.ok) throw new Error(path); return r.arrayBuffer(); });
    return fetch(path + ".bin" + V).then(function (r) { if (!r.ok) throw new Error(path); return r.arrayBuffer(); })
      .then(function (b) { return dec(new Uint8Array(b)); });
  }
  function getText(path) { return getBuf(path).then(function (b) { return new TextDecoder().decode(b); }); }
  function tryPassword(pw) {
    return fetch("media/seal.json" + V).then(function (r) { return r.json(); }).then(function (m) {
      return keyFor(pw, m).then(function (k) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(m.check).slice(0, 12) }, k, b64(m.check).slice(12)).then(function (pt) {
          if (new TextDecoder().decode(pt) !== "ok") throw new Error("bad");
          KEY = k;
        });
      });
    });
  }

  /* ---------- boot ---------- */
  function start() {
    return getText("content.html").then(function (h) {
      $("#app").innerHTML = h;
      $("#lock").classList.add("gone");
      document.body.classList.add("open");
      initPage();
      if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
    });
  }
  function boot() {
    if (!P.sealed) { start(); return; }
    var form = $("#lockform"), input = $("#pw"), msg = $("#lockmsg");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!input.value) return;
      msg.textContent = "Opening…";
      tryPassword(input.value).then(function () {
        try { sessionStorage.setItem("case-pw", input.value); } catch (err) {}
        msg.textContent = "";
        return start();
      }).catch(function () {
        msg.textContent = "That password did not open the page. Check the email that sent you the link.";
        input.select();
      });
    });
    var saved = null;
    try { saved = sessionStorage.getItem("case-pw"); } catch (err) {}
    if (saved) tryPassword(saved).then(start).catch(function () { try { sessionStorage.removeItem("case-pw"); } catch (err) {} });
    input.focus();
  }

  /* ---------- rendering helpers ---------- */
  function mmss(ms) { var s = Math.floor(ms / 1000); return ("0" + Math.floor(s / 60)).slice(-2) + ":" + ("0" + (s % 60)).slice(-2); }
  function mdInline(t) {
    var e = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return e.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function mdBlock(src) {   /* the rubric files: headings, tables, lists, paragraphs, code */
    var out = [], L = src.split("\n"), i = 0;
    while (i < L.length) {
      var s = L[i].trim();
      if (!s) { i++; continue; }
      if (s.indexOf("```") === 0) { var j = i + 1; while (j < L.length && L[j].trim().indexOf("```") !== 0) j++; out.push("<pre><code>" + mdInline(L.slice(i + 1, j).join("\n")) + "</code></pre>"); i = j + 1; continue; }
      var h = /^(#{1,4})\s+(.*)$/.exec(s);
      if (h) { out.push("<h" + (h[1].length + 1) + ">" + mdInline(h[2]) + "</h" + (h[1].length + 1) + ">"); i++; continue; }
      if (s.charAt(0) === "|") {
        var rows = []; while (i < L.length && L[i].trim().charAt(0) === "|") { rows.push(L[i].trim()); i++; }
        var t = "<div class='tw'><table>";
        rows.forEach(function (r, k) { if (k === 1 && /^\|[\s:|-]+\|$/.test(r)) return; var c = r.replace(/^\||\|$/g, "").split("|"); t += "<tr>" + c.map(function (x) { return (k === 0 ? "<th>" : "<td>") + mdInline(x.trim()) + (k === 0 ? "</th>" : "</td>"); }).join("") + "</tr>"; });
        out.push(t + "</table></div>"); continue;
      }
      if (/^(-|\*|\d+\.)\s/.test(s)) {
        var items = []; while (i < L.length && /^\s*(-|\*|\d+\.)\s/.test(L[i])) { items.push("<li>" + mdInline(L[i].trim().replace(/^(-|\*|\d+\.)\s+/, "")) + "</li>"); i++; }
        out.push("<ul>" + items.join("") + "</ul>"); continue;
      }
      if (s === "---") { out.push("<hr>"); i++; continue; }
      var p = []; while (i < L.length && L[i].trim() && !/^(#|\||```|(-|\*|\d+\.)\s|---$)/.test(L[i].trim())) { p.push(L[i].trim()); i++; }
      out.push("<p>" + mdInline(p.join(" ")) + "</p>");
    }
    return out.join("\n");
  }
  function tree(v) {   /* a JSON value, shown as stored */
    if (v === null || v === undefined) return el("span", "null", "null");
    if (Array.isArray(v)) {
      var d = el("div");
      if (!v.length) { d.appendChild(el("span", "null", "(empty)")); return d; }
      v.forEach(function (x) { var c = el("div", "card"); c.appendChild(tree(x)); d.appendChild(c); });
      return d;
    }
    if (typeof v === "object") {
      var dl = el("dl");
      Object.keys(v).forEach(function (k) { dl.appendChild(el("dt", null, k)); var dd = el("dd"); dd.appendChild(tree(v[k])); dl.appendChild(dd); });
      return dl;
    }
    var s = el("span", null, String(v)); s.setAttribute("dir", "auto"); return s;
  }
  function jsonPanel(note, obj) { var w = el("div", "jt"); w.appendChild(el("p", "note", note)); w.appendChild(tree(obj)); return w; }

  /* ---------- players ---------- */
  var media = {};
  function initPage() {
    $$(".player").forEach(initPlayer);
    $$(".message").forEach(initMessage);
    var io = "IntersectionObserver" in window ? new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { loadAudio(e.target); io.unobserve(e.target); } });
    }, { rootMargin: "300px" }) : null;
    $$(".player").forEach(function (p, i) { if (i === 0 || !io) loadAudio(p); else io.observe(p); });
  }
  function getMedia(code) {
    if (!media[code]) media[code] = getText("media/" + code + ".json").then(JSON.parse);
    return media[code];
  }
  function loadAudio(p) {
    if (p.dataset.audio) return;
    p.dataset.audio = "1";
    var a = $("audio", p), st = el("p", "astatus", "Loading the audio…");
    a.parentNode.insertBefore(st, a.nextSibling);
    getBuf("media/" + p.dataset.code + ".mp3").then(function (b) {
      a.src = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" }));
      a.preload = "metadata";
      st.remove();
    }).catch(function () { st.textContent = "The audio did not load. Reload the page to try again."; });
  }
  function initPlayer(p) {
    var code = p.dataset.code, a = $("audio", p);
    function show(tab) {
      $$(".tabs button", p).forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"); });
      $$(".panel", p).forEach(function (s) { s.classList.toggle("on", s.dataset.panel === tab); });
    }
    $$(".tabs button", p).forEach(function (b) { b.addEventListener("click", function () { show(b.dataset.tab); }); });
    $$(".panel .acc", p).forEach(function (b) { b.addEventListener("click", function () { b.parentNode.classList.toggle("on"); }); });
    getMedia(code).then(function (m) {
      var body = function (t) { return $(".panel[data-panel=" + t + "] .pbody", p); };
      renderTranscript(p, m, body("transcript"), a);
      var r = el("div", "md"); r.appendChild(el("p", "note", "The rubric for this lesson, as in " + m.rubric_file + " in the dataset."));
      var rb = el("div"); rb.innerHTML = mdBlock(m.rubric_md); r.appendChild(rb); body("rubric").appendChild(r);
      body("scores").appendChild(jsonPanel("Rumi's scores for this lesson, as stored in analysis/" + code + ".json.", m.scores));
      body("report").appendChild(jsonPanel("What Rumi wrote for the teacher, as stored in analysis/" + code + ".json, in the language it was sent in.", m.report));
      if (m.coach) body("coach").appendChild(jsonPanel("The record a coach made in the room, as stored in human/" + code + ".json. The debrief with the teacher is in the dataset.", m.coach));
    }).catch(function () { $(".panel .pbody", p).textContent = "This lesson's files did not load. Reload the page to try again."; });
  }
  function renderTranscript(p, m, box, a) {
    var lang = m.lang === "ur" ? "ur" : (m.lang === "ar" ? "ar" : "");
    box.appendChild(el("p", "note", m.segments[0] && m.segments[0].w ? "The transcript as Rumi stored it. Click a time or a word to jump there." : "The transcript as Rumi stored it, turn by turn. Click a time to jump there."));
    var rows = [], words = [];
    m.segments.forEach(function (g) {
      var r = el("div", "seg"), ts = el("span", "ts", mmss(g.s)), tx = el("div", "tx");
      ts.addEventListener("click", function () { if (a.src) { a.currentTime = g.s / 1000; a.play(); } });
      r.appendChild(ts); r.appendChild(el("span", "who", g.who));
      if (lang) tx.setAttribute("lang", lang);
      tx.setAttribute("dir", "auto");
      if (g.w) {
        g.w.forEach(function (w) {
          var s = el("span", "w", w[2]); s.dataset.t = w[0];
          s.addEventListener("click", function () { if (a.src) { a.currentTime = w[0] / 1000; a.play(); } });
          tx.appendChild(s); words.push([w[0], w[1], s]);
        });
      } else tx.textContent = g.t;
      r.appendChild(tx); box.appendChild(r); rows.push([g.s, g.e, r]);
    });
    var curR = null, curW = null;
    function find(list, ms) { var lo = 0, hi = list.length - 1, ans = -1; while (lo <= hi) { var mid = (lo + hi) >> 1; if (list[mid][0] <= ms) { ans = mid; lo = mid + 1; } else hi = mid - 1; } return ans; }
    function tick() {
      var ms = a.currentTime * 1000, i = find(rows, ms), r = i >= 0 && ms <= rows[i][1] + 1500 ? rows[i][2] : null;
      if (r !== curR) {
        if (curR) curR.classList.remove("now");
        if (r) { r.classList.add("now"); var bt = box.getBoundingClientRect(), rt = r.getBoundingClientRect(); if (rt.top < bt.top || rt.bottom > bt.bottom) box.scrollTop += rt.top - bt.top - 60; }
        curR = r;
      }
      if (words.length) {
        var j = find(words, ms), w = j >= 0 && ms <= words[j][1] + 400 ? words[j][2] : null;
        if (w !== curW) { if (curW) curW.classList.remove("now"); if (w) w.classList.add("now"); curW = w; }
      }
    }
    var raf = null;
    function loop() { tick(); raf = a.paused ? null : requestAnimationFrame(loop); }
    a.addEventListener("play", function () { if (!raf) loop(); });
    a.addEventListener("seeked", tick);
  }

  /* ---------- screen 2: the report as stored, beside our translation ---------- */
  var LABELS = [["caption", "The WhatsApp caption"], ["topic", "Topic"], ["affirmation", "Opening line"], ["score_framing", "On the score"],
    ["identity", "Your teaching"], ["strength", "Strength"], ["moments", "Moments"], ["horizon", "Next step"],
    ["journey_note", "Across sessions"], ["domain_whys", "Why each section scored as it did"]];
  function initMessage(box) {
    getMedia(box.dataset.code).then(function (m) {
      var rn = m.report.report_narrative || {}, td = m.report.teacher_delivery || {}, tr = m.translation || {};
      var lang = rn._language === "ur" ? "ur" : "";
      var g = el("div", "msg");
      g.appendChild(el("div", "colh", "As stored")); g.appendChild(el("div", "colh", "Our translation, for this page only"));
      function pair(label, src, en) {
        g.appendChild(el("div", "lab" + (/_/.test(label) ? " key" : ""), label));
        var a = el("div", "cell src"); a.setAttribute("dir", "auto"); if (lang) a.setAttribute("lang", lang);
        if (src instanceof Node) a.appendChild(src); else a.textContent = src == null ? "" : src;
        var b = el("div", "cell"); if (en instanceof Node) b.appendChild(en); else b.textContent = en == null ? "" : en;
        g.appendChild(a); g.appendChild(b);
      }
      function two(t, n) { var d = el("div"); var s = el("strong", null, t); d.appendChild(s); d.appendChild(el("div", null, n)); return d; }
      LABELS.forEach(function (L) {
        var k = L[0];
        if (k === "caption") pair(L[1], td.caption, tr.caption);
        else if (k === "strength") pair(L[1], two(rn.strength_name || "", rn.strength_note || ""), two(tr.strength_name || "", tr.strength_note || ""));
        else if (k === "horizon") pair(L[1], two(rn.horizon_title || "", rn.horizon_note || ""), two(tr.horizon_title || "", tr.horizon_note || ""));
        else if (k === "moments") (rn.moments || []).forEach(function (x, i) {
          var t = (tr.moments || [])[i] || {};
          function mo(o) { var d = el("div"); d.appendChild(el("strong", null, o.title || "")); var q = el("div"); q.appendChild(el("q", null, o.quote || "")); d.appendChild(q); d.appendChild(el("div", null, o.why || "")); return d; }
          pair(L[1] + " " + (i + 1), mo(x), mo(t));
        });
        else if (k === "domain_whys") Object.keys(rn.domain_whys || {}).forEach(function (d) { pair(d, rn.domain_whys[d], (tr.domain_whys || {})[d]); });
        else pair(L[1], rn[k], tr[k]);
      });
      box.innerHTML = ""; box.appendChild(g);
      var det = el("details"); det.appendChild(el("summary", null, "The scores behind it"));
      det.appendChild(jsonPanel("As stored in analysis/" + box.dataset.code + ".json. The full breakdown is in the player's Scores tab above.", m.scores.scores));
      box.appendChild(det);
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
